name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  license-firewall:
    name: Licensing Firewall
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard against vendored PDFs and closed-content dumps
        run: node scripts/license-firewall.mjs

  version-lockstep:
    name: Version Lockstep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Workspace versions match root
        run: node scripts/bump-version.mjs check

  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Root typecheck (tsc --build)
        run: npm run build

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run populate-ogl
      - run: npm run populate-dw
      - run: npm run populate-osr

      - name: Run tests
        run: npm test

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run populate-ogl
      - run: npm run populate-dw
      - run: npm run populate-osr

      - name: Coverage report
        run: npm run test:coverage
